# Configuration for the binary illicit content classification task

dataset_path: "data/binary.csv"  # path to CSV file with `text` and `label` columns
task: binary

# Train/validation/test splits
train_size: 0.8
val_size: 0.1  # remainder goes to test
test_size: 0.1
random_seed: 1337

# Model hyperparameters (common)
max_seq_length: 128
batch_size: 32
num_epochs: 5
learning_rate: 2e-5

# LoRA & quantisation (for LLMs)
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.1
quantisation_bits: 4  # use 8 or 16 for higher precision

# Classical model parameters
svm:
  C: 1.0
  kernel: "linear"
  ngram_range: [1, 2]
  min_df: 2
naive_bayes:
  alpha: 1.0
  ngram_range: [1, 2]
  min_df: 2

# Output paths
model_dir: "models"
log_dir: "runs"
