name: R CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
      - name: Install dependencies
        run: |
          Rscript mental_health_project_R/install_packages.R
      - name: Run tests
        run: |
          Rscript -e "testthat::test_dir('mental_health_project_R/tests', reporter = testthat::SummaryReporter$new())"